name: Free YouTube Stream

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run Streaming Script
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YT_STREAM_KEY }}
        run: python stream.py
